<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapVerse</title>
    <meta
      name="description"
      content="Keşif ve gezi haritası: yer ve adres arama, mekân bilgileri ve yol tarifi."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the theme before the first paint; src/theme/theme.ts takes over
      ;(function () {
        var saved
        try {
          saved = localStorage.getItem('mapverse:theme')
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#1f2329')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Link previews; crawlers need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MapVerse" />
    <meta
      property="og:description"
      content="Keşif ve gezi haritası: yer ve adres arama, mekân bilgileri ve yol tarifi."
    />
    <meta property="og:url" content="https://mapverse.github.io/MapVerse/" />
    <meta
      property="og:image"
      content="https://mapverse.github.io/MapVerse/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
